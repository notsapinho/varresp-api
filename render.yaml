services:
  - type: web
    name: varresp-api
    runtime: docker
    plan: free
    healthCheckPath: /api/saude
    envVars:
      - key: DB_URL
        value: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: 3
      - key: DDL_AUTO
        value: none
